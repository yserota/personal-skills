[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "day-manager"
version = "0.1.0"
description = "Daily context ingestion from Gmail, Google Calendar, and Slack for AI-assisted day management."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "google-api-python-client>=2.140.0",
  "google-auth-httplib2>=0.2.0",
  "google-auth-oauthlib>=1.2.0",
  "slack-sdk>=3.31.0",
  "python-dotenv>=1.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["day_manager*"]
